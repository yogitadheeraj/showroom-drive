<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unsubscribe | AutoAdvant</title>
  <meta name="description" content="Manage your AutoAdvant email subscription preferences." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.autoadvant.com/unsubscribe/" />
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { width: 100%; max-width: 460px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 28px; text-align: center; }
    h1 { margin: 10px 0 6px; font-size: 26px; }
    p { color: #475569; line-height: 1.5; }
    .icon { width: 56px; height: 56px; border-radius: 999px; background: #f1f5f9; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
    .btn { width: 100%; border: 0; border-radius: 10px; background: #dc2626; color: white; padding: 12px 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .muted { color: #64748b; font-size: 13px; margin-top: 14px; }
    .hidden { display: none; }
    a { color: #0ea5e9; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div id="icon" class="icon">⏳</div>
      <h1 id="title">Verifying...</h1>
      <p id="desc">Please wait while we verify your unsubscribe request.</p>
      <button id="confirmBtn" class="btn hidden">Confirm Unsubscribe</button>
      <p class="muted"><a href="/">Back to Home</a></p>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token');
      var apiBase = window.location.origin;

      var icon = document.getElementById('icon');
      var title = document.getElementById('title');
      var desc = document.getElementById('desc');
      var confirmBtn = document.getElementById('confirmBtn');

      function setState(nextTitle, nextDesc, nextIcon, showButton) {
        title.textContent = nextTitle;
        desc.textContent = nextDesc;
        icon.textContent = nextIcon;
        if (showButton) confirmBtn.classList.remove('hidden');
        else confirmBtn.classList.add('hidden');
      }

      async function callUnsubscribe(payload) {
        var res = await fetch(apiBase + '/api/functions/handle-email-unsubscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload || {}),
        });
        var json = await res.json().catch(function () { return {}; });
        if (!res.ok || (json && json.error)) {
          throw new Error((json && json.error && json.error.message) || 'Request failed');
        }
        return (json && json.data) || null;
      }

      if (!token) {
        setState('Invalid Link', 'This unsubscribe link is missing a token or has expired.', '⚠️', false);
        return;
      }

      callUnsubscribe({ token: token })
        .then(function (data) {
          if (data && data.valid === false && data.reason === 'already_unsubscribed') {
            setState('Already Unsubscribed', 'You are already unsubscribed from our emails.', '✅', false);
            return;
          }

          if (data && data.valid) {
            setState('Unsubscribe', 'Click below to confirm that you want to unsubscribe from future emails.', '📭', true);
            return;
          }

          setState('Invalid Link', 'This unsubscribe link is invalid or has expired.', '⚠️', false);
        })
        .catch(function () {
          setState('Invalid Link', 'This unsubscribe link is invalid or has expired.', '⚠️', false);
        });

      confirmBtn.addEventListener('click', function () {
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Processing...';

        callUnsubscribe({ token: token })
          .then(function (data) {
            if (data && data.success) {
              setState('Unsubscribed', 'You will no longer receive emails from us.', '✅', false);
              return;
            }
            setState('Something Went Wrong', 'Please try again later.', '⚠️', false);
          })
          .catch(function () {
            setState('Something Went Wrong', 'Please try again later.', '⚠️', false);
          })
          .finally(function () {
            confirmBtn.disabled = false;
            confirmBtn.textContent = 'Confirm Unsubscribe';
          });
      });
    })();
  </script>
</body>
</html>
